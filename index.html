<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Record Management System</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 16px; color: #1e293b; }
    .container { max-width: 960px; margin: auto; }
    h1 { text-align: center; color: #0f172a; font-size: 1.5rem; margin-bottom: 16px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .card { background: #fff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); text-align: center; }
    .card h3 { margin: 0; font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
    .card p { margin: 6px 0 0; font-size: 1.4rem; font-weight: bold; color: #2563eb; }
    .box { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    input, select, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; width: 100%; }
    button { background: #2563eb; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-edit { background: #f59e0b; padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .btn-del { background: #ef4444; padding: 6px 10px; font-size: 0.8rem; width: auto; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #334155; }
    .actions { display: flex; gap: 6px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎓 Student Record Management System</h1>

  <!-- Summary Section (Aggregate Functions) -->
  <div class="summary-grid">
    <div class="card"><h3>Total Students</h3><p id="stat-total">0</p></div>
    <div class="card"><h3>Average CGPA</h3><p id="stat-avg">0.00</p></div>
    <div class="card"><h3>Highest CGPA</h3><p id="stat-max">0.00</p></div>
  </div>

  <!-- Add / Update Form -->
  <div class="box">
    <h3 id="form-title" style="margin-top:0;">Add New Student</h3>
    <form id="student-form" class="form-grid">
      <input type="text" id="student_id" placeholder="Student ID (e.g. 2024-1-60-011)" required />
      <input type="text" id="full_name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <select id="dept_id" required></select>
      <input type="number" id="cgpa" step="0.01" min="0" max="4" placeholder="CGPA (0.00 - 4.00)" required />
      <input type="number" id="enrollment_year" placeholder="Year (e.g. 2024)" required />
      <button type="submit" id="submit-btn">Add Student</button>
      <button type="button" id="cancel-btn" class="btn-secondary" style="display:none;" onclick="resetForm()">Cancel Edit</button>
    </form>
  </div>

  <!-- Search & Records Table -->
  <div class="box">
    <input type="text" id="search-input" placeholder="🔍 Search by Student ID, Name, or Department..." oninput="renderTable()" />
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>CGPA</th>
            <th>Year</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let db;
  let editingId = null;

  async function initDB() {
    const SQL = await initSqlJs({
      locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    });
    db = new SQL.Database();

    // Create Tables with Primary Key and Foreign Key
    db.run(`
      PRAGMA foreign_keys = ON;
      CREATE TABLE departments (
        dept_id INTEGER PRIMARY KEY AUTOINCREMENT,
        dept_name TEXT NOT NULL
      );
      CREATE TABLE students (
        student_id TEXT PRIMARY KEY,
        full_name TEXT NOT NULL,
        email TEXT NOT NULL,
        dept_id INTEGER,
        cgpa REAL CHECK (cgpa >= 0 AND cgpa <= 4),
        enrollment_year INTEGER,
        FOREIGN KEY (dept_id) REFERENCES departments(dept_id)
      );
      INSERT INTO departments (dept_name) VALUES
        ('Computer Science & Engineering'),
        ('Electrical & Electronic Engineering'),
        ('Business Administration'),
        ('Civil Engineering');
      INSERT INTO students VALUES
        ('2023-1-60-001', 'Arafat Rahman', 'arafat@example.edu', 1, 3.85, 2023),
        ('2023-1-60-002', 'Nusrat Jahan', 'nusrat@example.edu', 1, 3.92, 2023),
        ('2023-1-60-003', 'Tanvir Ahmed', 'tanvir@example.edu', 2, 3.45, 2023),
        ('2023-1-60-004', 'Sadia Islam', 'sadia@example.edu', 3, 3.60, 2023),
        ('2023-2-60-005', 'Mahmudul Hasan', 'mahmud@example.edu', 1, 3.15, 2023),
        ('2023-2-60-006', 'Farhana Yasmin', 'farhana@example.edu', 4, 3.70, 2023),
        ('2024-1-60-007', 'Rafiul Karim', 'rafiul@example.edu', 2, 3.28, 2024),
        ('2024-1-60-008', 'Tasnim Tabassum', 'tasnim@example.edu', 1, 3.95, 2024),
        ('2024-1-60-009', 'Mehedi Hasan', 'mehedi@example.edu', 3, 2.95, 2024),
        ('2024-2-60-010', 'Jannatul Ferdous', 'jannat@example.edu', 4, 3.55, 2024);
    `);

    loadDepartments();
    refreshUI();
  }

  function loadDepartments() {
    const res = db.exec("SELECT dept_id, dept_name FROM departments");
    const select = document.getElementById("dept_id");
    select.innerHTML = res[0].values.map(r => `<option value="${r[0]}">${r[1]}</option>`).join("");
  }

  function refreshUI() {
    updateSummary();
    renderTable();
  }

  function updateSummary() {
    const res = db.exec("SELECT COUNT(*), ROUND(AVG(cgpa), 2), MAX(cgpa) FROM students");
    const [total, avg, max] = res[0].values[0];
    document.getElementById("stat-total").textContent = total || 0;
    document.getElementById("stat-avg").textContent = avg ? avg.toFixed(2) : "0.00";
    document.getElementById("stat-max").textContent = max ? max.toFixed(2) : "0.00";
  }

  function renderTable() {
    const q = document.getElementById("search-input").value.trim();
    const stmt = db.prepare(`
      SELECT s.student_id, s.full_name, s.email, d.dept_name, s.cgpa, s.enrollment_year, s.dept_id
      FROM students s
      LEFT JOIN departments d ON s.dept_id = d.dept_id
      WHERE s.student_id LIKE ? OR s.full_name LIKE ? OR d.dept_name LIKE ?
      ORDER BY s.student_id ASC
    `);
    const like = `%${q}%`;
    stmt.bind([like, like, like]);

    const tbody = document.getElementById("records-body");
    tbody.innerHTML = "";
    while (stmt.step()) {
      const row = stmt.get();
      tbody.innerHTML += `
        <tr>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
          <td>${Number(row[4]).toFixed(2)}</td>
          <td>${row[5]}</td>
          <td class="actions">
            <button class="btn-edit" onclick='editStudent(${JSON.stringify(row)})'>Edit</button>
            <button class="btn-del" onclick="deleteStudent('${row[0]}')">Delete</button>
          </td>
        </tr>`;
    }
    stmt.free();
  }

  document.getElementById("student-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const id = document.getElementById("student_id").value.trim();
    const name = document.getElementById("full_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const dept = Number(document.getElementById("dept_id").value);
    const cgpa = Number(document.getElementById("cgpa").value);
    const year = Number(document.getElementById("enrollment_year").value);

    try {
      if (editingId) {
        db.run("UPDATE students SET full_name=?, email=?, dept_id=?, cgpa=?, enrollment_year=? WHERE student_id=?",
          [name, email, dept, cgpa, year, editingId]);
      } else {
        db.run("INSERT INTO students VALUES (?, ?, ?, ?, ?, ?)",
          [id, name, email, dept, cgpa, year]);
      }
      resetForm();
      refreshUI();
    } catch (err) {
      alert("Database Error: " + err.message);
    }
  });

  function editStudent(row) {
    editingId = row[0];
    document.getElementById("student_id").value = row[0];
    document.getElementById("student_id").disabled = true;
    document.getElementById("full_name").value = row[1];
    document.getElementById("email").value = row[2];
    document.getElementById("dept_id").value = row[6];
    document.getElementById("cgpa").value = row[4];
    document.getElementById("enrollment_year").value = row[5];
    document.getElementById("form-title").textContent = "Update Student (" + row[0] + ")";
    document.getElementById("submit-btn").textContent = "Save Changes";
    document.getElementById("cancel-btn").style.display = "inline-block";
  }

  function resetForm() {
    editingId = null;
    document.getElementById("student-form").reset();
    document.getElementById("student_id").disabled = false;
    document.getElementById("form-title").textContent = "Add New Student";
    document.getElementById("submit-btn").textContent = "Add Student";
    document.getElementById("cancel-btn").style.display = "none";
  }

  function deleteStudent(id) {
    if (confirm(`Are you sure you want to delete student ${id}?`)) {
      db.run("DELETE FROM students WHERE student_id = ?", [id]);
      refreshUI();
    }
  }

  initDB();
</script>
</body>
</html>
